# Stack réseau self-hosted : VPN WireGuard, DNS filtrant, reverse proxy TLS,
# supervision et logs centralisés.
#
# Démarrage : make init && make up   (voir README.md)

name: homelab

x-hardening: &hardening
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  # ---------------------------------------------------------------------------
  # Accès à l'API Docker en lecture seule (Traefik et Alloy n'ont jamais
  # accès directement au socket Docker)
  # ---------------------------------------------------------------------------
  socket-proxy:
    <<: *hardening
    image: tecnativa/docker-socket-proxy:v0.5.0
    read_only: true
    tmpfs:
      - /run
      - /tmp          # l'entrypoint y génère haproxy.cfg
    environment:
      CONTAINERS: 1   # lecture des conteneurs et de leurs logs
      NETWORKS: 1     # lecture des réseaux (Alloy en a besoin pour la découverte)
      EVENTS: 1
      PING: 1
      VERSION: 1
      POST: 0         # aucune action en écriture
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - socket

  # ---------------------------------------------------------------------------
  # Reverse proxy + TLS automatique (Let's Encrypt, challenge TLS-ALPN sur 443)
  # ---------------------------------------------------------------------------
  traefik:
    <<: *hardening
    image: traefik:v3.7
    user: "65532:65532"
    read_only: true
    sysctls:
      net.ipv4.ip_unprivileged_port_start: 0   # écoute sur 443 sans être root
    command:
      - --global.checkNewVersion=false
      - --global.sendAnonymousUsage=false
      - --log.level=INFO
      - --accesslog=true
      - --accesslog.format=json
      - --api.dashboard=true
      - --ping=true
      - --ping.entrypoint=metrics
      - --metrics.prometheus=true
      - --metrics.prometheus.entrypoint=metrics
      - --metrics.prometheus.addServicesLabels=true
      - --entrypoints.websecure.address=:443
      - --entrypoints.websecure.http.tls.certresolver=letsencrypt
      - --entrypoints.websecure.http.middlewares=secure-headers@file
      - --entrypoints.metrics.address=:8082
      - --providers.docker.endpoint=tcp://socket-proxy:2375
      - --providers.docker.exposedbydefault=false
      - --providers.file.directory=/etc/traefik/dynamic
      - --providers.file.watch=true
      - --certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL}
      - --certificatesresolvers.letsencrypt.acme.storage=/data/acme.json
      - --certificatesresolvers.letsencrypt.acme.tlschallenge=true
      - --certificatesresolvers.letsencrypt.acme.caserver=${ACME_CA_SERVER:-https://acme-v02.api.letsencrypt.org/directory}
    ports:
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./config/traefik/dynamic:/etc/traefik/dynamic:ro
      - ./data/traefik:/data
    secrets:
      - traefik_dashboard_users
    labels:
      traefik.enable: "true"
      traefik.http.routers.dashboard.rule: Host(`traefik.${DOMAIN}`)
      traefik.http.routers.dashboard.service: api@internal
      traefik.http.routers.dashboard.middlewares: dashboard-auth
      traefik.http.middlewares.dashboard-auth.basicauth.usersfile: /run/secrets/traefik_dashboard_users
    networks:
      - frontend
      - vpn
      - monitoring
      - socket
    depends_on:
      - socket-proxy

  # ---------------------------------------------------------------------------
  # VPN WireGuard + interface d'administration
  # ---------------------------------------------------------------------------
  wg-easy:
    <<: *hardening
    image: ghcr.io/wg-easy/wg-easy:15
    # Exception documentée : wg-easy tourne en root avec les capacités par défaut,
    # car il crée l'interface wg0 et les règles iptables (NAT) des clients VPN.
    cap_drop: []
    cap_add:
      - NET_ADMIN
    sysctls:
      net.ipv4.ip_forward: 1
      net.ipv4.conf.all.src_valid_mark: 1
    env_file:
      - ./secrets/wg-easy.env   # INIT_PASSWORD, généré par scripts/init.sh
    environment:
      DISABLE_IPV6: "true"
      INIT_ENABLED: "true"
      INIT_USERNAME: ${WG_ADMIN_USER:-admin}
      INIT_HOST: ${WG_HOST}
      INIT_PORT: ${WG_PORT:-51820}
      INIT_DNS: 10.8.1.3          # les clients VPN utilisent AdGuard
    ports:
      - "${WG_PORT:-51820}:${WG_PORT:-51820}/udp"
    volumes:
      - wireguard:/etc/wireguard
    labels:
      traefik.enable: "true"
      traefik.docker.network: homelab_vpn
      traefik.http.routers.wg.rule: Host(`vpn.${DOMAIN}`)
      traefik.http.services.wg.loadbalancer.server.port: 51821
    networks:
      vpn:
        ipv4_address: 10.8.1.2

  # ---------------------------------------------------------------------------
  # DNS filtrant (publicités, trackers) pour les clients VPN
  # ---------------------------------------------------------------------------
  adguard:
    <<: *hardening
    image: adguard/adguardhome:v0.107.79
    # Exception documentée : au premier lancement, AdGuard refuse de démarrer s'il n'est
    # pas root (il vérifie ses droits avant même d'écouter sur le port 53).
    # Il tourne donc en root, mais avec toutes les capacités retirées sauf les deux
    # nécessaires à un serveur DNS.
    cap_add:
      - NET_BIND_SERVICE
      - NET_RAW
    volumes:
      - ./data/adguard/work:/opt/adguardhome/work
      - ./data/adguard/conf:/opt/adguardhome/conf
    labels:
      traefik.enable: "true"
      traefik.docker.network: homelab_frontend
      traefik.http.routers.dns.rule: Host(`dns.${DOMAIN}`)
      traefik.http.services.dns.loadbalancer.server.port: 3000
    networks:
      frontend: {}
      vpn:
        ipv4_address: 10.8.1.3

  # ---------------------------------------------------------------------------
  # Supervision : métriques, sondes, logs, dashboards
  # ---------------------------------------------------------------------------
  prometheus:
    <<: *hardening
    image: prom/prometheus:v3.15.1
    read_only: true
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
    volumes:
      - ./config/prometheus:/etc/prometheus:ro
      - prometheus:/prometheus
    networks:
      - monitoring

  blackbox-exporter:
    <<: *hardening
    image: prom/blackbox-exporter:v0.29.0
    read_only: true
    command:
      - --config.file=/etc/blackbox/blackbox.yml
    volumes:
      - ./config/blackbox:/etc/blackbox:ro
    networks:
      - monitoring
      - frontend
      - vpn

  node-exporter:
    <<: *hardening
    image: prom/node-exporter:v1.12.1
    read_only: true
    pid: host
    command:
      - --path.rootfs=/host
    volumes:
      - /:/host:ro,rslave
    networks:
      - monitoring

  loki:
    <<: *hardening
    image: grafana/loki:3.7.8
    command:
      - -config.file=/etc/loki/loki.yml
    volumes:
      - ./config/loki/loki.yml:/etc/loki/loki.yml:ro
      - loki:/loki
    networks:
      - monitoring

  alloy:
    <<: *hardening
    image: grafana/alloy:v1.20.1
    user: "65534:65534"
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/data
      - --disable-reporting
      - /etc/alloy/config.alloy
    volumes:
      - ./config/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - ./data/alloy:/data
    networks:
      - monitoring
      - socket
    depends_on:
      - loki
      - socket-proxy

  grafana:
    <<: *hardening
    image: grafana/grafana:13.0
    environment:
      GF_SERVER_ROOT_URL: https://grafana.${DOMAIN}:${HTTPS_PORT:-443}
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    secrets:
      - grafana_admin_password
    volumes:
      - ./config/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./config/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana:/var/lib/grafana
    labels:
      traefik.enable: "true"
      traefik.docker.network: homelab_frontend
      traefik.http.routers.grafana.rule: Host(`grafana.${DOMAIN}`)
      traefik.http.services.grafana.loadbalancer.server.port: 3000
    networks:
      - frontend
      - monitoring
    depends_on:
      - prometheus
      - loki

# -----------------------------------------------------------------------------
# Réseaux : chaque service ne rejoint que les réseaux dont il a besoin
# -----------------------------------------------------------------------------
networks:
  frontend:     # interfaces web publiées via Traefik
  vpn:          # WireGuard <-> AdGuard (DNS des clients VPN)
    ipam:
      config:
        - subnet: 10.8.1.0/24
          # IP dynamiques dans la moitié haute : .2 (wg-easy) et .3 (AdGuard)
          # restent libres pour les IP fixes, quel que soit l'ordre de démarrage
          ip_range: 10.8.1.128/25
  monitoring:   # Prometheus, exporters, Loki, Alloy, Grafana : aucun accès Internet
    internal: true
  socket:       # accès à l'API Docker via le proxy uniquement
    internal: true

volumes:
  wireguard:
  prometheus:
  loki:
  grafana:

secrets:
  traefik_dashboard_users:
    file: ./secrets/traefik_dashboard_users
  grafana_admin_password:
    file: ./secrets/grafana_admin_password