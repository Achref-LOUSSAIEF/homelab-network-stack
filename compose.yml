# Self-hosted network stack: WireGuard VPN, filtering DNS, TLS reverse proxy,
# monitoring and centralized logs.
#
# Start: make init && make up   (see README.md)

name: homelab

x-hardening: &hardening
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  # ---------------------------------------------------------------------------
  # Read-only Docker API access (Traefik and Alloy never touch
  # the Docker socket directly)
  # ---------------------------------------------------------------------------
  socket-proxy:
    <<: *hardening
    image: tecnativa/docker-socket-proxy:v0.5.0
    read_only: true
    tmpfs:
      - /run
      - /tmp          # the entrypoint writes haproxy.cfg here
    environment:
      CONTAINERS: 1   # read containers and their logs
      NETWORKS: 1     # read networks (Alloy needs this for discovery)
      EVENTS: 1
      PING: 1
      VERSION: 1
      POST: 0         # no write actions
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - socket

  # ---------------------------------------------------------------------------
  # Reverse proxy + automatic TLS (Let's Encrypt, TLS-ALPN challenge on 443)
  # ---------------------------------------------------------------------------
  traefik:
    <<: *hardening
    image: traefik:v3.7
    user: "65532:65532"
    read_only: true
    sysctls:
      net.ipv4.ip_unprivileged_port_start: 0   # bind 443 without root
    command:
      - --global.checkNewVersion=false
      - --global.sendAnonymousUsage=false
      - --log.level=INFO
      - --accesslog=true
      - --accesslog.format=json
      - --api.dashboard=true
      - --ping=true
      - --ping.entrypoint=metrics
      - --metrics.prometheus=true
      - --metrics.prometheus.entrypoint=metrics
      - --metrics.prometheus.addServicesLabels=true
      - --entrypoints.websecure.address=:443
      - --entrypoints.websecure.http.tls.certresolver=letsencrypt
      - --entrypoints.websecure.http.middlewares=secure-headers@file
      - --entrypoints.metrics.address=:8082
      - --providers.docker.endpoint=tcp://socket-proxy:2375
      - --providers.docker.exposedbydefault=false
      - --providers.file.directory=/etc/traefik/dynamic
      - --providers.file.watch=true
      - --certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL}
      - --certificatesresolvers.letsencrypt.acme.storage=/data/acme.json
      - --certificatesresolvers.letsencrypt.acme.tlschallenge=true
      - --certificatesresolvers.letsencrypt.acme.caserver=${ACME_CA_SERVER:-https://acme-v02.api.letsencrypt.org/directory}
    ports:
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./config/traefik/dynamic:/etc/traefik/dynamic:ro
      - ./data/traefik:/data
    secrets:
      - traefik_dashboard_users
    labels:
      traefik.enable: "true"
      traefik.http.routers.dashboard.rule: Host(`traefik.${DOMAIN}`)
      traefik.http.routers.dashboard.service: api@internal
      traefik.http.routers.dashboard.middlewares: dashboard-auth
      traefik.http.middlewares.dashboard-auth.basicauth.usersfile: /run/secrets/traefik_dashboard_users
    networks:
      - frontend
      - vpn
      - monitoring
      - socket
    depends_on:
      - socket-proxy

  # ---------------------------------------------------------------------------
  # WireGuard VPN + admin UI
  # ---------------------------------------------------------------------------
  wg-easy:
    <<: *hardening
    image: ghcr.io/wg-easy/wg-easy:15
    # Documented exception: wg-easy runs as root with default capabilities
    # because it creates the wg0 interface and the VPN clients' iptables (NAT) rules.
    cap_drop: []
    cap_add:
      - NET_ADMIN
    sysctls:
      net.ipv4.ip_forward: 1
      net.ipv4.conf.all.src_valid_mark: 1
    env_file:
      - ./secrets/wg-easy.env   # INIT_PASSWORD, generated by scripts/init.sh
    environment:
      DISABLE_IPV6: "true"
      INIT_ENABLED: "true"
      INIT_USERNAME: ${WG_ADMIN_USER:-admin}
      INIT_HOST: ${WG_HOST}
      INIT_PORT: ${WG_PORT:-51820}
      INIT_DNS: 10.8.1.3          # VPN clients use AdGuard
    ports:
      - "${WG_PORT:-51820}:${WG_PORT:-51820}/udp"
    volumes:
      - wireguard:/etc/wireguard
    labels:
      traefik.enable: "true"
      traefik.docker.network: homelab_vpn
      traefik.http.routers.wg.rule: Host(`vpn.${DOMAIN}`)
      traefik.http.services.wg.loadbalancer.server.port: 51821
    networks:
      vpn:
        ipv4_address: 10.8.1.2

  # ---------------------------------------------------------------------------
  # Filtering DNS (ads, trackers) for VPN clients
  # ---------------------------------------------------------------------------
  adguard:
    <<: *hardening
    image: adguard/adguardhome:v0.107.79
    # Documented exception: on first start AdGuard refuses to run unless it is
    # root (it checks its privileges before even binding port 53).
    # So it runs as root, but with every capability dropped except the two
    # a DNS server needs.
    cap_add:
      - NET_BIND_SERVICE
      - NET_RAW
    volumes:
      - ./data/adguard/work:/opt/adguardhome/work
      - ./data/adguard/conf:/opt/adguardhome/conf
    labels:
      traefik.enable: "true"
      traefik.docker.network: homelab_frontend
      traefik.http.routers.dns.rule: Host(`dns.${DOMAIN}`)
      traefik.http.services.dns.loadbalancer.server.port: 3000
    networks:
      frontend: {}
      vpn:
        ipv4_address: 10.8.1.3

  # ---------------------------------------------------------------------------
  # Monitoring: metrics, probes, logs, dashboards
  # ---------------------------------------------------------------------------
  prometheus:
    <<: *hardening
    image: prom/prometheus:v3.15.0
    read_only: true
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
    volumes:
      - ./config/prometheus:/etc/prometheus:ro
      - prometheus:/prometheus
    networks:
      - monitoring

  blackbox-exporter:
    <<: *hardening
    image: prom/blackbox-exporter:v0.29.0
    read_only: true
    command:
      - --config.file=/etc/blackbox/blackbox.yml
    volumes:
      - ./config/blackbox:/etc/blackbox:ro
    networks:
      - monitoring
      - frontend
      - vpn

  node-exporter:
    <<: *hardening
    image: prom/node-exporter:v1.12.1
    read_only: true
    pid: host
    command:
      - --path.rootfs=/host
    volumes:
      - /:/host:ro,rslave
    networks:
      - monitoring

  loki:
    <<: *hardening
    image: grafana/loki:3.7.8
    command:
      - -config.file=/etc/loki/loki.yml
    volumes:
      - ./config/loki/loki.yml:/etc/loki/loki.yml:ro
      - loki:/loki
    networks:
      - monitoring

  alloy:
    <<: *hardening
    image: grafana/alloy:v1.20.1
    user: "65534:65534"
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/data
      - --disable-reporting
      - /etc/alloy/config.alloy
    volumes:
      - ./config/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - ./data/alloy:/data
    networks:
      - monitoring
      - socket
    depends_on:
      - loki
      - socket-proxy

  grafana:
    <<: *hardening
    image: grafana/grafana:13.3
    environment:
      GF_SERVER_ROOT_URL: https://grafana.${DOMAIN}:${HTTPS_PORT:-443}
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    secrets:
      - grafana_admin_password
    volumes:
      - ./config/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./config/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana:/var/lib/grafana
    labels:
      traefik.enable: "true"
      traefik.docker.network: homelab_frontend
      traefik.http.routers.grafana.rule: Host(`grafana.${DOMAIN}`)
      traefik.http.services.grafana.loadbalancer.server.port: 3000
    networks:
      - frontend
      - monitoring
    depends_on:
      - prometheus
      - loki

# -----------------------------------------------------------------------------
# Networks: each service only joins the networks it needs
# -----------------------------------------------------------------------------
networks:
  frontend:     # web UIs published through Traefik
  vpn:          # WireGuard <-> AdGuard (DNS for VPN clients)
    ipam:
      config:
        - subnet: 10.8.1.0/24
          # dynamic IPs in the upper half: .2 (wg-easy) and .3 (AdGuard)
          # stay free for static IPs, whatever the start order
          ip_range: 10.8.1.128/25
  monitoring:   # Prometheus, exporters, Loki, Alloy, Grafana: no Internet access
    internal: true
  socket:       # Docker API access through the proxy only
    internal: true

volumes:
  wireguard:
  prometheus:
  loki:
  grafana:

secrets:
  traefik_dashboard_users:
    file: ./secrets/traefik_dashboard_users
  grafana_admin_password:
    file: ./secrets/grafana_admin_password
