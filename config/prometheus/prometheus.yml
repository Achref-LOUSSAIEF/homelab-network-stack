global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  # --- Métriques exposées par les services --------------------------------
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: traefik
    static_configs:
      - targets: ["traefik:8082"]

  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: loki
    static_configs:
      - targets: ["loki:3100"]

  - job_name: alloy
    static_configs:
      - targets: ["alloy:12345"]

  - job_name: grafana
    static_configs:
      - targets: ["grafana:3000"]

  - job_name: blackbox
    static_configs:
      - targets: ["blackbox-exporter:9115"]

  # --- Sondes de disponibilité (blackbox-exporter) ------------------------
  - job_name: probe-http
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - http://traefik:8082/ping
          - http://grafana:3000/api/health
          - http://adguard:3000/
          - http://10.8.1.2:51821/
    relabel_configs: &probe_relabel
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  - job_name: probe-dns
    metrics_path: /probe
    params:
      module: [dns_resolve]
    static_configs:
      - targets:
          - 10.8.1.3:53
    relabel_configs: *probe_relabel
