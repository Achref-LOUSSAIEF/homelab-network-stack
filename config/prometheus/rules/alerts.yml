groups:
  - name: stack
    rules:
      - alert: TargetDown
        expr: up == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.job }} is no longer being scraped"
          description: "Target {{ $labels.instance }} has been unreachable for 2 minutes."

      - alert: ProbeFailed
        expr: probe_success == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Probe failing: {{ $labels.instance }}"
          description: "Service {{ $labels.instance }} is not responding correctly ({{ $labels.job }})."

      - alert: SlowDnsResolution
        expr: probe_dns_lookup_time_seconds > 0.5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Slow DNS resolution"
          description: "AdGuard has taken over 500 ms to answer for 5 minutes."

  - name: host
    rules:
      - alert: HostHighCpu
        expr: 100 - (avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 90
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Host CPU above 90% for 10 minutes"

      - alert: HostLowMemory
        expr: node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes < 0.10
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Less than 10% memory available"

      - alert: HostDiskAlmostFull
        expr: node_filesystem_avail_bytes{fstype!~"tmpfs|overlay"} / node_filesystem_size_bytes{fstype!~"tmpfs|overlay"} < 0.10
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Disk almost full on {{ $labels.mountpoint }}"
