groups:
  - name: stack
    rules:
      - alert: TargetDown
        expr: up == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.job }} ne répond plus au scraping"
          description: "La cible {{ $labels.instance }} est injoignable depuis 2 minutes."

      - alert: ProbeFailed
        expr: probe_success == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Sonde en échec : {{ $labels.instance }}"
          description: "Le service {{ $labels.instance }} ne répond pas correctement ({{ $labels.job }})."

      - alert: SlowDnsResolution
        expr: probe_dns_lookup_time_seconds > 0.5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Résolution DNS lente"
          description: "AdGuard met plus de 500 ms à répondre depuis 5 minutes."

  - name: host
    rules:
      - alert: HostHighCpu
        expr: 100 - (avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 90
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "CPU de l'hôte > 90 % depuis 10 minutes"

      - alert: HostLowMemory
        expr: node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes < 0.10
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Moins de 10 % de mémoire disponible"

      - alert: HostDiskAlmostFull
        expr: node_filesystem_avail_bytes{fstype!~"tmpfs|overlay"} / node_filesystem_size_bytes{fstype!~"tmpfs|overlay"} < 0.10
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Disque presque plein sur {{ $labels.mountpoint }}"
